<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sophie — NEXUS-OMEGA</title><style>:root{--b:#07090d;--p:#0d1118;--l:#202a38;--t:#edf3ff;--m:#8290a6;--a:#77a7ff;--g:#58d69b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#18284a,#07090d 38%);color:var(--t);font:14px system-ui,sans-serif;height:100vh;overflow:hidden}button,textarea{font:inherit}.app{display:grid;grid-template-columns:245px 1fr 290px;height:100vh}aside,.inspector{background:#090d13e8;border-color:var(--l)}aside{border-right:1px solid var(--l);padding:18px 14px;display:flex;flex-direction:column;gap:14px}.brand{display:flex;gap:10px;align-items:center}.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#77a7ff 25%,#6e50ff 65%,#1b163d);box-shadow:0 0 28px #566cff66}.brand b{font-size:16px}.brand small{display:block;color:var(--m);font-size:10px;letter-spacing:.14em}.new{border:1px solid #33415a;background:#151d2a;padding:11px;border-radius:12px;color:white}.nav{display:grid;gap:5px}.nav button,.thread{background:none;border:0;text-align:left;padding:10px;border-radius:10px;color:#aeb9cb;cursor:pointer}.nav button.active,.nav button:hover,.thread.active{background:#151d2a;color:white}.section{color:#59677d;text-transform:uppercase;font-size:10px;letter-spacing:.14em;margin:8px}.threads{overflow:auto}.bottom{margin-top:auto;color:#627086;font-size:10px;line-height:1.6}main{display:flex;flex-direction:column;min-width:0}.top{height:64px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.status{color:#aeb9cb}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:8px;box-shadow:0 0 12px #58d69b}.mode{border:1px solid var(--l);background:#0e141e;border-radius:10px;padding:7px 10px}.feed{flex:1;overflow:auto;padding:34px max(5vw }.drawer-section{margin-top:10px}.drawer-title{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#59677d;margin:12px 8px 7px}.drawer-list{display:grid;gap:4px}.drawer-item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0d131d;border:1px solid #182334;border-radius:10px;padding:9px 10px;color:#aeb9cb;font-size:12px;cursor:pointer}.drawer-item.active{background:#151d2a;color:#fff;border-color:#2b3b55}.drawer-item small{color:#66758c}.tool-pill{display:inline-flex;border:1px solid #25344a;background:#101824;border-radius:999px;padding:4px 7px;color:#9fb0c7;font-size:10px}.artifact-link{display:block;color:#b9c8dd;text-decoration:none;padding:9px 0;border-bottom:1px solid #192231;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artifact-link:hover{color:#fff}.send.stop{background:#ffedf0;color:#9d1c32}.send.stop::before{content:'■ ';font-size:11px}.command-state{font-size:11px;color:#738198;padding:4px 2px;min-height:16px}.menu-close{display:none}@media(max-width:1100px){.menu-close{display:inline-flex;align-items:center;justify-content:center;float:right;border:1px solid var(--l);background:#0e141e;color:#aeb9cb;border-radius:8px;width:32px;height:32px}.drawer-scroll{overflow:auto;height:calc(100% - 55px)}}@media(max-width:650px){.drawer-scroll{height:calc(100% - 48px)}.inspector{top:58px}}.msg.assistant .body{max-width:900px}.msg.assistant strong{color:#fff;font-weight:800}.msg.assistant h3{font-size:18px;line-height:1.3;margin:12px 0 7px;color:#fff}.msg.assistant ul{margin:8px 0 12px;padding-left:22px}.msg.assistant li{margin:5px 0}.msg-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;opacity:.78}.msg-action{border:1px solid #202a38;background:#0b1018;color:#8290a6;border-radius:8px;padding:5px 8px;font-size:11px;cursor:pointer}.msg-action:hover{color:#fff;background:#121a26}.msg.user .msg-actions{justify-content:flex-end}.msg.user .body{white-space:pre-wrap}</style><style>#login{position:fixed;inset:0;background:#05070bd9;display:flex;align-items:center;justify-content:center;z-index:20}.loginbox{width:min(380px,90vw);background:#0d131c;border:1px solid #273448;border-radius:18px;padding:24px;box-shadow:0 20px 80px #000}.loginbox h2{margin-top:0}.loginbox p{color:#8290a6}.loginbox input{width:100%;padding:12px;background:#080c12;border:1px solid #273448;border-radius:10px;color:#fff;margin:10px 0 12px;box-sizing:border-box}.loginbox button{padding:10px 15px;border:0;border-radius:10px;background:#edf3ff;color:#080b10;font-weight:700;cursor:pointer;touch-action:manipulation;min-width:108px}.loginbox button:disabled{opacity:.65;cursor:wait}.loginerr{font-size:12px;margin-top:10px;min-height:16px}.loginerr.error{color:#ff6f83}.loginerr.success{color:#69e6a7}.login-status{display:inline-flex;align-items:center;gap:8px}#login[hidden]{display:none!important}.login-spinner{width:12px;height:12px;border:2px solid #5b6b82;border-top-color:#fff;border-radius:50%;animation:loginSpin .7s linear infinite}@keyframes loginSpin{to{transform:rotate(360deg)}}</style></head><body><div id="login"><div class="loginbox"><h2>Unlock Sophie</h2><p>This Sophie instance is protected. Enter the access password to open the NEXUS workspace.</p><input id="accessPassword" type="password" autocomplete="current-password" placeholder="Access password"><button id="loginBtn" type="button" onclick="window.sophieUnlock()"><span id="loginBtnText">Unlock</span></button><div class="loginerr" id="loginErr" role="status" aria-live="polite"></div></div></div><script type="module" src="/js/index.js"></script></body></html>
