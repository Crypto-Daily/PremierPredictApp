name: Sophie factory checks

on:
  pull_request:
    branches:
      - import/sophie-jarvis-upgrade
      - main
    paths:
      - "sophie/**"
      - ".github/workflows/sophie-factory.yml"
  push:
    branches:
      - feat/sophie-model-factory
    paths:
      - "sophie/**"
      - ".github/workflows/sophie-factory.yml"

permissions:
  contents: read

concurrency:
  group: sophie-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sophie
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sophie/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Unit and regression tests
        run: npm test
