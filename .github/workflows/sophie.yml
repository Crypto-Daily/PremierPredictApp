name: Sophie
on:
  push:
    paths: ['sophie/**']
  pull_request:
    paths: ['sophie/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sophie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sophie/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
