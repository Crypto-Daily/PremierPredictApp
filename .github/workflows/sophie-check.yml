name: Sophie checks

on:
  push:
    paths:
      - 'sophie/**'
  pull_request:
    paths:
      - 'sophie/**'

jobs:
  test-sophie:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sophie

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sophie/package-lock.json

      - run: npm ci
      - run: npm test
      - run: node --check src/core/modeManager.js
      - run: node --check src/core/artifactManager.js
      - run: node --check src/agent/agentPolicy.js
      - run: node --check src/agent/sophieAgent.js
      - run: node --check src/commands/commandProcessor.js
      - run: node --check src/server/server.js
