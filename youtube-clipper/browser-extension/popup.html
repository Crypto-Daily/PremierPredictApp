<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Clipper Connector</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <h1>YouTube Clipper</h1>
    <p id="connection" class="muted">Not connected</p>
    <label>Clipper address<input id="server" type="url" placeholder="https://your-clipper.example.com"></label>
    <label>Pairing code<input id="code" type="text" autocomplete="off" placeholder="Paste code from Clipper"></label>
    <button id="pair">Connect browser</button>
    <hr>
    <button id="send" disabled>Send this YouTube video</button>
    <p id="status" role="status"></p>
    <p class="hint">Only the active video's URL is sent, and only when you press the button. Browser cookies and page contents are never collected.</p>
  </main>
  <script src="popup.js"></script>
</body></html>
